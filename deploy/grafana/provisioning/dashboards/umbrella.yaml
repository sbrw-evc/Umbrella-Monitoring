# Dashboards from deploy/grafana/dashboards (built from the *.yaml resources
# by build.py). The container entrypoint copies them to /tmp/umbrella-dashboards
# with the public Umbrella address filled in.
apiVersion: 1

providers:
  - name: umbrella
    folder: Umbrella
    folderUid: umbrella
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /tmp/umbrella-dashboards
      foldersFromFilesStructure: false
