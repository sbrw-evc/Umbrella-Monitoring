[agent]
  interval = "10s"
  flush_interval = "5s"
  hostname = "$LAB_HOST"
  omit_hostname = false

[[inputs.tail]]
  files = ["/pgdata/log/*.log"]
  initial_read_offset = "end"
  watch_method = "poll"
  name_override = "postgres_log"
  data_format = "value"
  data_type = "string"
  [inputs.tail.tags]
    service = "zabbix-db"
    source = "postgresql"
  [inputs.tail.multiline]
    pattern = '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}'
    match_which_line = "previous"
    invert_match = true
    timeout = "3s"

[[inputs.docker_log]]
  endpoint = "unix:///var/run/docker.sock"
  from_beginning = false
  timeout = "10s"
  docker_label_include = ["com.docker.compose.service", "com.docker.compose.project"]
  container_name_exclude = ["*telegraf*", "*fluentd*"]
  source_tag = false

[[outputs.kafka]]
  brokers = ["kafka:9092"]
  topic = "logs"
  required_acks = 1
  max_retry = 5
  data_format = "json"
  json_timestamp_units = "1ms"
  [outputs.kafka.topic_suffix]
    method = "measurement"
    separator = "."
