<system>
  log_level info
</system>

<source>
  @type kafka_group
  brokers kafka:9092
  consumer_group fluentd-opensearch
  topics logs.postgres_log,logs.docker_log
  format json
  time_source kafka
  start_from_beginning false
  retry_limit 0
</source>

<filter logs.postgres_log>
  @type record_transformer
  enable_ruby true
  renew_record true
  <record>
    raw ${record.dig("fields", "value").to_s}
    host ${record.dig("tags", "service") || "zabbix-db"}
    service postgresql
    collector ${record.dig("tags", "host")}
    log_source postgresql
  </record>
</filter>

<filter logs.postgres_log>
  @type parser
  key_name raw
  reserve_data true
  remove_key_name_field false
  emit_invalid_record_to_error false
  <parse>
    @type regexp
    expression /^(?<pg_time>\S+ \S+ \S+) \[(?<pid>\d+)\] (?<sqlstate>[0-9A-Z]{5}) (?:(?<db_user>[^@\s]+)@(?<db_name>\S+) )?(?<pg_level>[A-Z]+[0-9]?):\s+(?<message>.*)$/m
  </parse>
</filter>

<filter logs.postgres_log>
  @type record_transformer
  enable_ruby true
  <record>
    message ${(record["message"] || record["raw"]).to_s[0, 16384]}
    duration_ms ${(m = record["message"].to_s.match(/duration: ([\d.]+) ms/)) ? m[1].to_f : nil}
    level ${d = (m = record["message"].to_s.match(/duration: ([\d.]+) ms/)) ? m[1].to_f : 0.0; case record["pg_level"].to_s when "PANIC", "FATAL" then "fatal" when "ERROR" then "error" when "WARNING" then "warning" else (d >= ENV["PG_SLOW_MS"].to_f ? "warning" : "info") end}
    error_code ${(record["message"].to_s =~ /duration: [\d.]+ ms/) ? "SLOW_QUERY" : ((record["sqlstate"].to_s == "" || record["sqlstate"] == "00000") ? "PG_" + record["pg_level"].to_s : "SQLSTATE_" + record["sqlstate"].to_s)}
  </record>
</filter>

<filter logs.docker_log>
  @type record_transformer
  enable_ruby true
  renew_record true
  <record>
    message ${record.dig("fields", "message").to_s.gsub(/\e\[[0-9;]*m/, "").strip[0, 16384]}
    container ${record.dig("tags", "container_name")}
    image ${record.dig("tags", "container_image")}
    stream ${record.dig("tags", "stream")}
    host ${record.dig("tags", "com.docker.compose.service") || record.dig("tags", "container_name")}
    service ${record.dig("tags", "com.docker.compose.service") || record.dig("tags", "container_name")}
    collector ${record.dig("tags", "host")}
    log_source docker
  </record>
</filter>

<filter logs.docker_log>
  @type record_transformer
  enable_ruby true
  <record>
    level ${(m = record["message"].to_s.match(/\b(PANIC|FATAL|CRITICAL|CRIT|ERROR|ERR|WARNING|WARN|panic|fatal|critical|error|warning|warn|Error|Warning|Fatal)\b/)) ? (case m[1].downcase when "panic", "fatal" then "fatal" when "critical", "crit" then "critical" when "error", "err" then "error" else "warning" end) : "info"}
    error_code ${(m = record["message"].to_s.match(/\b(PANIC|FATAL|CRITICAL|CRIT|ERROR|ERR|WARNING|WARN|panic|fatal|critical|error|warning|warn|Error|Warning|Fatal)\b/)) ? "LOG_" + m[1].upcase : "LOG_INFO"}
  </record>
</filter>

<match logs.postgres_log>
  @type opensearch
  host opensearch
  port 9200
  scheme http
  logstash_format true
  logstash_prefix pg-logs
  logstash_dateformat %Y.%m.%d
  suppress_type_name true
  use_legacy_template false
  template_name umbrella-logs
  template_file /fluentd/etc/index-template.json
  template_overwrite true
  reconnect_on_error true
  reload_on_failure true
  <buffer>
    @type memory
    flush_interval 5s
    retry_max_interval 30s
    retry_forever true
  </buffer>
</match>

<match logs.docker_log>
  @type opensearch
  host opensearch
  port 9200
  scheme http
  logstash_format true
  logstash_prefix container-logs
  logstash_dateformat %Y.%m.%d
  suppress_type_name true
  use_legacy_template false
  template_name umbrella-logs
  template_file /fluentd/etc/index-template.json
  template_overwrite true
  reconnect_on_error true
  reload_on_failure true
  <buffer>
    @type memory
    flush_interval 5s
    chunk_limit_size 4m
    total_limit_size 128m
    overflow_action drop_oldest_chunk
    retry_max_interval 30s
    retry_forever true
  </buffer>
</match>
