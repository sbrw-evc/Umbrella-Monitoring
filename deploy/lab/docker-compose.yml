name: umbrella-lab

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  openbao:
    image: ${OPENBAO_IMAGE:-openbao/openbao:2.7.1}
    restart: unless-stopped
    entrypoint: ["bao", "server", "-config=/openbao/config/openbao.hcl"]
    user: "0"
    volumes:
      - ./openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
      - openbao-data:/openbao/file
    ports:
      - "127.0.0.1:${OPENBAO_PORT:-8200}:8200"
    logging: *logging
    networks: [lab]

  openbao-init:
    image: ${OPENBAO_IMAGE:-openbao/openbao:2.7.1}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/config/init.sh"]
    user: "0"
    environment:
      BAO_ADDR: http://openbao:8200
      BOOTSTRAP_ADMIN_PASSWORD: ${UMBRELLA_ADMIN_PASSWORD:?run install.sh or fill .env}
      BOOTSTRAP_GRAFANA_TOKEN: ${UMBRELLA_GRAFANA_TOKEN:-}
      BOOTSTRAP_METRICS_TOKEN: ${UMBRELLA_METRICS_TOKEN:-}
    volumes:
      - ./openbao/init.sh:/config/init.sh:ro
      - ./openbao/umbrella-policy.hcl:/config/umbrella-policy.hcl:ro
      - ./secrets/openbao:/state
      - ./secrets/umbrella:/umbrella
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/openbao-ready"]
      interval: 3s
      retries: 100
      start_period: 5s
    depends_on: [openbao]
    logging: *logging
    networks: [lab]

  umbrella:
    build:
      context: ../../app
      args:
        VERSION: ${UMBRELLA_VERSION:-lab}
    image: umbrella-mvp:lab
    restart: unless-stopped
    depends_on:
      openbao-init:
        condition: service_healthy
      umbrella-db:
        condition: service_healthy
    environment:
      UMBRELLA_PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:${UMBRELLA_PORT:-8080}
      UMBRELLA_WS_ORIGINS: ${PUBLIC_HOST:-localhost}:*,localhost:*,127.0.0.1:*
      UMBRELLA_DATA_DIR: /data
      UMBRELLA_OPENBAO_ADDR: http://openbao:8200
      UMBRELLA_OPENBAO_ROLE_ID_FILE: /run/umbrella/role_id
      UMBRELLA_OPENBAO_SECRET_ID_FILE: /run/umbrella/secret_id
      UMBRELLA_ADMIN_USER: ${UMBRELLA_ADMIN_USER:-admin}
      UMBRELLA_ADMIN_PASSWORD: openbao://umbrella/bootstrap#admin_password
      UMBRELLA_GRAFANA_TOKEN: openbao://umbrella/bootstrap#grafana_token
      UMBRELLA_METRICS_TOKEN: openbao://umbrella/bootstrap#metrics_token
      UMBRELLA_ALLOW_HTTP_WEBHOOKS: ${UMBRELLA_ALLOW_HTTP_WEBHOOKS:-false}
    volumes:
      - umbrella-data:/data
      - ./secrets/umbrella:/run/umbrella:ro
    ports:
      - "${UMBRELLA_PORT:-8080}:8080"
    logging: *logging
    networks: [lab]

  umbrella-db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: umbrella
      POSTGRES_PASSWORD: ${UMBRELLA_DB_PASSWORD:?run install.sh or fill .env}
      POSTGRES_DB: umbrella
    volumes:
      - umbrella-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umbrella -d umbrella"]
      interval: 5s
      retries: 30
    logging: *logging
    networks: [lab]

  zabbix-db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_directory=log
      - -c
      - log_filename=postgresql.log
      - -c
      - log_rotation_age=0
      - -c
      - log_rotation_size=50MB
      - -c
      - "log_line_prefix=%m [%p] %e %q%u@%d "
      - -c
      - log_min_duration_statement=${PG_SLOW_MS:-20}
      - -c
      - log_min_messages=warning
      - -c
      - log_checkpoints=on
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?run install.sh or fill .env}
      POSTGRES_DB: zabbix
    volumes:
      - zabbix-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 5s
      retries: 30
    logging: *logging
    networks: [lab]

  zabbix-server:
    image: ${ZABBIX_SERVER_IMAGE:-zabbix/zabbix-server-pgsql:alpine-7.0-latest}
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      POSTGRES_DB: zabbix
      ZBX_STARTALERTERS: "3"
    depends_on:
      zabbix-db:
        condition: service_healthy
    logging: *logging
    networks: [lab]

  zabbix-web:
    image: ${ZABBIX_WEB_IMAGE:-zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest}
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      POSTGRES_DB: zabbix
      PHP_TZ: ${TZ:-Europe/Moscow}
    ports:
      - "${ZABBIX_WEB_PORT:-8081}:8080"
    depends_on: [zabbix-server]
    logging: *logging
    networks: [lab]

  zabbix-agent:
    image: ${ZABBIX_AGENT_IMAGE:-zabbix/zabbix-agent2:alpine-7.0-latest}
    restart: unless-stopped
    hostname: ${LAB_HOST:-lab-host-1}
    environment:
      ZBX_HOSTNAME: ${LAB_HOST:-lab-host-1}
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_ACTIVE: zabbix-server
    depends_on: [zabbix-server]
    logging: *logging
    networks: [lab]

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        sed "s/__LAB_HOST__/$${LAB_HOST}/g" /etc/prometheus/prometheus.yml > /prometheus/prometheus.yml
        exec /bin/prometheus --config.file=/prometheus/prometheus.yml --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=7d --storage.tsdb.retention.size=1GB --web.enable-lifecycle
    environment:
      LAB_HOST: ${LAB_HOST:-lab-host-1}
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    secrets:
      - umbrella_metrics_token
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    logging: *logging
    networks: [lab]

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.28.1}
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    secrets:
      - prometheus_webhook_token
    logging: *logging
    networks: [lab]

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.9.1}
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - ./node-textfile:/textfile:ro
    logging: *logging
    networks: [lab]

  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.55.1}
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,hugetlb,referenced_memory,cpu_topology,resctrl,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    logging: *logging
    networks: [lab]

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.2.2}
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 30
      start_period: 20s
    logging: *logging
    networks: [lab]

  telegraf:
    image: ${TELEGRAF_IMAGE:-telegraf:1.40-alpine}
    restart: unless-stopped
    user: "0"
    entrypoint: ["telegraf"]
    command: ["--config", "/etc/telegraf/telegraf.conf"]
    environment:
      LAB_HOST: ${LAB_HOST:-lab-host-1}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - zabbix-db:/pgdata:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      kafka:
        condition: service_healthy
    logging: *logging
    networks: [lab]

  fluentd:
    build: ./fluentd
    image: umbrella-lab-fluentd:1
    restart: unless-stopped
    environment:
      PG_SLOW_MS: ${PG_SLOW_MS:-20}
    depends_on:
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    logging: *logging
    networks: [lab]

  opensearch:
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:2.19.3}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      OPENSEARCH_JAVA_OPTS: -Xms768m -Xmx768m
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      retries: 30
    logging: *logging
    networks: [lab]

  opensearch-dashboards:
    image: ${OSD_IMAGE:-opensearchproject/opensearch-dashboards:2.19.3}
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      NODE_OPTIONS: --max-old-space-size=512
    ports:
      - "${OSD_PORT:-5601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    logging: *logging
    networks: [lab]

  netbox-db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: ${NETBOX_DB_PASSWORD:?run install.sh or fill .env}
      POSTGRES_DB: netbox
    volumes:
      - netbox-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox -d netbox"]
      interval: 5s
      retries: 30
    logging: *logging
    networks: [lab]

  netbox-redis:
    image: ${VALKEY_IMAGE:-valkey/valkey:8.1-alpine}
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${NETBOX_REDIS_PASSWORD:?run install.sh or fill .env}"]
    volumes:
      - netbox-redis:/data
    logging: *logging
    networks: [lab]

  netbox:
    image: ${NETBOX_IMAGE:-netboxcommunity/netbox:v4.4.10-3.4.2}
    restart: unless-stopped
    depends_on:
      netbox-db:
        condition: service_healthy
      netbox-redis:
        condition: service_started
    environment:
      DB_HOST: netbox-db
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: ${NETBOX_DB_PASSWORD}
      REDIS_HOST: netbox-redis
      REDIS_PASSWORD: ${NETBOX_REDIS_PASSWORD}
      REDIS_DATABASE: "0"
      REDIS_CACHE_HOST: netbox-redis
      REDIS_CACHE_PASSWORD: ${NETBOX_REDIS_PASSWORD}
      REDIS_CACHE_DATABASE: "1"
      SECRET_KEY: ${NETBOX_SECRET_KEY:?run install.sh or fill .env}
      SKIP_SUPERUSER: "false"
      SUPERUSER_NAME: admin
      SUPERUSER_EMAIL: admin@lab.local
      SUPERUSER_PASSWORD: ${NETBOX_ADMIN_PASSWORD:?run install.sh or fill .env}
      SUPERUSER_API_TOKEN: ${NETBOX_API_TOKEN:?run install.sh or fill .env}
      ALLOWED_HOSTS: "*"
      TIME_ZONE: ${TZ:-Europe/Moscow}
    volumes:
      - netbox-media:/opt/netbox/netbox/media
    ports:
      - "${NETBOX_PORT:-8000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login/ >/dev/null"]
      interval: 15s
      retries: 40
      start_period: 120s
    logging: *logging
    networks: [lab]

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.1.1}
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /tmp/umbrella-dashboards
        for f in /etc/grafana/umbrella-dashboards/*.json; do
          sed "s#http://localhost:8080#$${UMBRELLA_PUBLIC_URL}#g" "$$f" > "/tmp/umbrella-dashboards/$${f##*/}"
        done
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run install.sh or fill .env}
      GF_SERVER_ROOT_URL: http://${PUBLIC_HOST:-localhost}:${GRAFANA_PORT:-3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL: yesoreyeram-infinity-datasource,grafana-opensearch-datasource
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /tmp/umbrella-dashboards/umbrella-incidents.json
      UMBRELLA_GRAFANA_TOKEN: ${UMBRELLA_GRAFANA_TOKEN}
      UMBRELLA_PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:${UMBRELLA_PORT:-8080}
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/umbrella-dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    logging: *logging
    networks: [lab]

  toolbox:
    build: ./toolbox
    image: umbrella-lab-toolbox:1
    profiles: [tools]
    env_file: .env
    environment:
      IN_TOOLBOX: "1"
      UMB_URL: http://umbrella:8080
      ZBX_URL: http://zabbix-web:8080
      PROM_URL: http://prometheus:9090
      AM_URL: http://alertmanager:9093
      GRAFANA_URL: http://grafana:3000
      OSD_URL: http://opensearch-dashboards:5601
      NETBOX_URL: http://netbox:8080
    volumes:
      - ./:/lab
    networks: [lab]

secrets:
  umbrella_metrics_token:
    environment: UMBRELLA_METRICS_TOKEN
  prometheus_webhook_token:
    environment: PROMETHEUS_WEBHOOK_TOKEN

volumes:
  openbao-data:
  umbrella-data:
  umbrella-db:
  zabbix-db:
  prometheus-data:
  alertmanager-data:
  opensearch-data:
  netbox-db:
  netbox-redis:
  netbox-media:
  grafana-data:

networks:
  lab:
