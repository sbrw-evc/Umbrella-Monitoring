groups:
  - name: umbrella-lab
    rules:
      - alert: UmbrellaLabTestFailure
        expr: umbrella_lab_test_failure > 0
        labels:
          severity: error
          method: other
        annotations:
          summary: "Lab test failure on {{ $labels.host }}"
          value: "{{ $value }}"

      - alert: HostCpuBusy
        expr: 100 * (1 - avg by (host) (rate(node_cpu_seconds_total{mode="idle"}[1m]))) > 5
        for: 1m
        labels:
          severity: warning
          method: use
        annotations:
          summary: "CPU {{ $labels.host }} above 5%"
          value: "{{ $value | printf \"%.1f\" }}%"

      - alert: HostLoadHigh
        expr: node_load1 / on (host) count by (host) (node_cpu_seconds_total{mode="idle"}) > 0.2
        for: 1m
        labels:
          severity: warning
          method: use
        annotations:
          summary: "Load per CPU on {{ $labels.host }} above 0.2"
          value: "{{ $value | printf \"%.2f\" }}"

      - alert: HostMemoryUsed
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 40
        for: 2m
        labels:
          severity: error
          method: use
        annotations:
          summary: "Memory on {{ $labels.host }} above 40%"
          value: "{{ $value | printf \"%.1f\" }}%"

      - alert: ContainerCpuBusy
        expr: 100 * sum by (host, service) (rate(container_cpu_usage_seconds_total{service!=""}[1m])) > 3
        for: 1m
        labels:
          severity: warning
          method: use
          ci: "{{ $labels.service }}"
        annotations:
          summary: "Container {{ $labels.service }} CPU above 3%"
          value: "{{ $value | printf \"%.1f\" }}%"

      - alert: ContainerMemoryLarge
        expr: sum by (host, service) (container_memory_working_set_bytes{service!=""}) / 1048576 > 300
        for: 2m
        labels:
          severity: warning
          method: use
          ci: "{{ $labels.service }}"
        annotations:
          summary: "Container {{ $labels.service }} uses more than 300 MB"
          value: "{{ $value | printf \"%.0f\" }} MB"

      - alert: ContainerRestarted
        expr: changes(container_start_time_seconds{service!=""}[10m]) > 0
        labels:
          severity: error
          method: use
          ci: "{{ $labels.service }}"
        annotations:
          summary: "Container {{ $labels.service }} restarted"
          value: "{{ $value }}"

      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: error
          method: red
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }} on {{ $labels.host }}"
          value: "up = 0"
