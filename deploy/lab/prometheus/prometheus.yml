global:
  scrape_interval: 15s
  evaluation_interval: 10s
  external_labels:
    lab: umbrella

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels: { host: prometheus }

  - job_name: node
    scrape_interval: 10s
    static_configs:
      - targets: [node-exporter:9100]
        labels: { host: __LAB_HOST__ }

  - job_name: cadvisor
    scrape_interval: 15s
    static_configs:
      - targets: [cadvisor:8080]
        labels: { host: __LAB_HOST__ }
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
      - regex: container_label_.*
        action: labeldrop

  - job_name: umbrella
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/umbrella_metrics_token
    static_configs:
      - targets: [umbrella:8080]
        labels: { host: umbrella }

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
        labels: { host: alertmanager }
