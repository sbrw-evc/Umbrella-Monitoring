route:
  receiver: umbrella
  group_by: [alertname, host, service]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: umbrella
    webhook_configs:
      - url: http://umbrella:8080/api/ingest/prometheus
        send_resolved: true
        max_alerts: 0
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/prometheus_webhook_token
