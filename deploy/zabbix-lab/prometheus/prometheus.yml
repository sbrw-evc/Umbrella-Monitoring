# Prometheus of the Umbrella lab. Short intervals so the smoke test sees
# alerts within a minute; raise them for anything bigger than a lab.
global:
  scrape_interval: 15s
  evaluation_interval: 10s
  external_labels:
    lab: umbrella

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels: { host: umbrella-lab-prometheus }

  # The "host" label names the CMDB entry in Umbrella (connector "prometheus").
  - job_name: node
    scrape_interval: 10s
    static_configs:
      - targets: [node-exporter:9100]
        labels: { host: umbrella-lab-node }

  # Umbrella /metrics. The bearer token is UMBRELLA_METRICS_TOKEN from .env,
  # mounted as a compose secret; with an empty token /metrics is open.
  - job_name: umbrella
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/umbrella_metrics_token
    static_configs:
      - targets: [umbrella:8080]
        labels: { host: umbrella }

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
        labels: { host: umbrella-lab-alertmanager }
